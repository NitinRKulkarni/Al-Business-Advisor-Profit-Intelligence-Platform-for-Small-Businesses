spring:
  application:
    name: omni-cfo-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/omnicfo_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
  auth:
    username: ${APP_AUTH_USERNAME:teamsanskriti}
    password: ${APP_AUTH_PASSWORD:Sanskriti@2026!Secure}
    session-secret: ${APP_AUTH_SESSION_SECRET:sanskriti_default_secret_key_2026}

ai:
  service:
    python:
      base-url: ${AI_PYTHON_SERVICE_URL:http://localhost:8000}
      extract-endpoint: /api/v1/extract
