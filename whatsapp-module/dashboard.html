<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Insights Dashboard</title>
<style>
  :root{
    --ink:#1c2320;
    --paper:#f6f5f1;
    --panel:#ffffff;
    --line:#e2e0d8;
    --accent:#2f6f5e;
    --accent-soft:#e7f0ec;
    --warn:#b3492b;
    --warn-soft:#f7e8e3;
    --muted:#6b6f6a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Iowan Old Style','Georgia',serif;
    line-height:1.5;
  }
  .wrap{max-width:1040px;margin:0 auto;padding:40px 24px 80px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:28px;border-bottom:2px solid var(--ink);padding-bottom:16px;}
  h1{font-size:28px;margin:0;font-weight:600;letter-spacing:-0.01em;}
  .meta{font-family:'Helvetica Neue',Arial,sans-serif;font-size:13px;color:var(--muted);}
  .loader{font-family:'Helvetica Neue',Arial,sans-serif;}
  .loader input{display:none;}
  .loader label{
    display:inline-block;
    padding:9px 16px;
    background:var(--ink);
    color:var(--paper);
    border-radius:3px;
    cursor:pointer;
    font-size:13px;
  }
  .loader label:hover{background:#33403a;}
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:36px;
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .stat{background:var(--panel);padding:16px 18px;}
  .stat .n{font-size:26px;font-weight:700;font-family:'Iowan Old Style',Georgia,serif;}
  .stat .l{font-size:12px;color:var(--muted);text-transform:none;}
  section{margin-bottom:36px;}
  section h2{
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:13px;
    font-weight:700;
    color:var(--accent);
    margin:0 0 12px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }
  .empty{color:var(--muted);font-size:14px;font-style:italic;}
  .items{display:grid;gap:8px;}
  .item{
    background:var(--panel);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    padding:12px 14px;
    font-size:15px;
  }
  .item.warn{border-left-color:var(--warn);}
  .item .who{font-weight:700;margin-right:6px;}
  .tag{
    display:inline-block;
    font-family:'Helvetica Neue',Arial,sans-serif;
    font-size:11px;
    padding:2px 7px;
    border-radius:10px;
    margin-left:8px;
    vertical-align:middle;
    background:var(--accent-soft);
    color:var(--accent);
  }
  .tag.warn{background:var(--warn-soft);color:var(--warn);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:32px;}
  @media(max-width:700px){.grid2{grid-template-columns:1fr;}}
  .empty-state{
    text-align:center;
    padding:80px 20px;
    color:var(--muted);
    font-family:'Helvetica Neue',Arial,sans-serif;
  }
  .empty-state .big{font-family:'Iowan Old Style',Georgia,serif;font-size:20px;color:var(--ink);margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Business Insights</h1>
      <div class="meta" id="metaLine">No file loaded yet</div>
    </div>
    <div class="loader">
      <label for="fileInput">Load insights.json</label>
      <input type="file" id="fileInput" accept="application/json">
    </div>
  </header>

  <div id="content">
    <div class="empty-state">
      <div class="big">Nothing loaded yet</div>
      <div>Click "Load insights.json" above and pick the file generated by extractor.py</div>
    </div>
  </div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const content = document.getElementById('content');
const metaLine = document.getElementById('metaLine');

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (evt) => {
    try {
      const data = JSON.parse(evt.target.result);
      render(data);
    } catch (err) {
      content.innerHTML = `<div class="empty-state"><div class="big">Could not read that file</div><div>${err.message}</div></div>`;
    }
  };
  reader.readAsText(file);
});

function esc(s){
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function section(title, itemsHtml, count){
  return `<section><h2>${esc(title)} (${count})</h2>${itemsHtml}</section>`;
}

function list(arr, renderFn){
  if (!arr || arr.length === 0) return '<div class="empty">Nothing found in this category</div>';
  return `<div class="items">${arr.map(renderFn).join('')}</div>`;
}

function render(data){
  const meta = data._meta || {};
  metaLine.textContent = [
    meta.source_file ? `Source: ${meta.source_file}` : '',
    meta.total_messages_analyzed != null ? `${meta.total_messages_analyzed} messages analyzed` : '',
    meta.model ? `Model: ${meta.model}` : ''
  ].filter(Boolean).join('  ·  ');

  const counts = {
    enquiries: (data.customer_enquiries || []).length,
    orders: (data.orders_leads || []).filter(o => o.status === 'order').length,
    leads: (data.orders_leads || []).filter(o => o.status === 'lead').length,
    complaints: (data.complaints_negative_feedback || []).length,
    actions: (data.action_items || []).length,
  };

  const stats = `
    <div class="stats">
      <div class="stat"><div class="n">${counts.enquiries}</div><div class="l">Enquiries</div></div>
      <div class="stat"><div class="n">${counts.orders}</div><div class="l">Orders</div></div>
      <div class="stat"><div class="n">${counts.leads}</div><div class="l">Leads</div></div>
      <div class="stat"><div class="n">${counts.complaints}</div><div class="l">Complaints</div></div>
      <div class="stat"><div class="n">${counts.actions}</div><div class="l">Action items</div></div>
    </div>`;

  const enquiries = section('Customer Enquiries',
    list(data.customer_enquiries, i => `<div class="item"><span class="who">${esc(i.customer)}</span>${esc(i.enquiry)}</div>`),
    counts.enquiries);

  const products = section('Products & Services Discussed',
    list(data.products_services_discussed, i => `<div class="item">${esc(i.item)} <span class="tag">${esc(i.context)}</span></div>`),
    (data.products_services_discussed || []).length);

  const orders = section('Orders & Leads',
    list(data.orders_leads, i => `<div class="item"><span class="who">${esc(i.customer)}</span>${esc(i.detail)}<span class="tag ${i.status === 'lead' ? 'warn' : ''}">${esc(i.status)}</span></div>`),
    (data.orders_leads || []).length);

  const prices = section('Prices & Amounts',
    list(data.prices_amounts, i => `<div class="item">${esc(i.item)} — ${esc(i.amount_text)}</div>`),
    (data.prices_amounts || []).length);

  const requirements = section('Customer Requirements',
    list(data.customer_requirements, i => `<div class="item"><span class="who">${esc(i.customer)}</span>${esc(i.requirement)}</div>`),
    (data.customer_requirements || []).length);

  const complaints = section('Complaints & Negative Feedback',
    list(data.complaints_negative_feedback, i => `<div class="item warn"><span class="who">${esc(i.customer)}</span>${esc(i.issue)}<span class="tag warn">${esc(i.severity)}</span></div>`),
    counts.complaints);

  const actions = section('Action Items',
    list(data.action_items, i => `<div class="item ${i.priority === 'high' ? 'warn' : ''}">${esc(i.action)} <span class="tag ${i.priority === 'high' ? 'warn' : ''}">${esc(i.owner)} · ${esc(i.priority)}</span></div>`),
    counts.actions);

  const sentiment = section('Customer Sentiment',
    list(data.customer_sentiment, i => `<div class="item ${i.sentiment === 'negative' ? 'warn' : ''}"><span class="who">${esc(i.customer)}</span>${esc(i.reason)}<span class="tag ${i.sentiment === 'negative' ? 'warn' : ''}">${esc(i.sentiment)}</span></div>`),
    (data.customer_sentiment || []).length);

  const recs = section('Business Recommendations',
    list(data.business_recommendations, i => `<div class="item"><strong>${esc(i.recommendation)}</strong><br>${esc(i.why)}</div>`),
    (data.business_recommendations || []).length);

  content.innerHTML = stats +
    `<div class="grid2">
      <div>${enquiries}${products}${prices}</div>
      <div>${orders}${requirements}${complaints}</div>
    </div>` +
    actions + sentiment + recs;
}
</script>
</body>
</html>
